services:
  - type: web
    name: skillpath-navigator
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn skillpath.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /app/
    autoDeployTrigger: checksPass
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DB_ENGINE
        value: sqlite
