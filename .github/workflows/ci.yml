name: Django checks and tests

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skillpath
          POSTGRES_USER: skillpath
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillpath -d skillpath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-development-key
      DJANGO_DEBUG: 'true'
      DB_ENGINE: postgresql
      DB_NAME: skillpath
      DB_USER: skillpath
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify PostgreSQL connection
        run: >-
          python manage.py shell -c
          "from django.db import connection;
          connection.ensure_connection();
          assert connection.vendor == 'postgresql', f'Expected PostgreSQL, got {connection.vendor}';
          print(f'Connected test backend: {connection.vendor}')"
      - name: Run Django system checks
        run: python manage.py check
      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Validate checked-in dataset
        run: python manage.py load_data --validate-only
      - name: Run full test suite
        run: python manage.py test
